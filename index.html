LUMA | PERSONAL BANKING
Open this file directly in a browser. All HTML, CSS and JavaScript are included.
No server, installation, account or external assets are required.
All balances and transactions are sample data. No real payments are made.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f2f6f8">
<meta name="description" content="Luma brings your card, payment details and account balances into one clear view.">
<title>Luma | Personal banking</title>
<script>
// Apply the saved theme before first paint. Fall back to the device preference.
(() => {
  let saved;
  try { saved = localStorage.getItem('luma-theme'); } catch {}
  document.documentElement.dataset.theme = saved === 'light' || saved === 'dark'
    ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
})();
</script>

<body>
<div class="wrap">
  <div class="browser">
    <header class="bank-header">
      <div class="brand" aria-label="Luma personal banking">
        <span class="brandmark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M7 5v14h11" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="17" cy="7" r="2" fill="currentColor"/></svg></span>
        Luma
      </div>
      <nav class="bank-nav" aria-label="Main navigation">
        <button class="nav-btn active" data-action="accounts">Accounts</button>
        <button class="nav-btn" data-action="activity">Activity</button>
        <button class="nav-btn" data-action="help">Help</button>
      </nav>
      <div class="header-tools">
        <button id="theme-toggle" class="theme-toggle" data-action="toggle-theme" type="button" aria-label="Switch to dark mode">Dark mode</button>
        <div class="user"><span class="user-name">Maya Patel</span><span class="avatar" aria-label="Maya Patel">MP</span></div>
      </div>
    </header>
    <main id="app" class="bank-main"></main>
  </div>
  <footer class="site-footer">
    <div><span class="footer-brand">Luma</span>Everyday banking, made clear. · Interactive demo</div>
    <div class="footer-actions">
      <button data-action="test-controls" aria-expanded="false" aria-controls="test-controls">Demo settings</button>
      <button data-action="reset" title="Restore sample balances and clear payment entries">Reset demo</button>
      <a href="" id="download-source" download="index.html">Download HTML ↓</a>
    </div>
  </footer>
  <div class="testing" id="test-controls">
    <div><label for="outcome">Next payment result</label><p class="test-desc">Try a different outcome to explore payment status and recovery. This demo uses fictional balances. No real money moves.</p></div>
    <select id="outcome"><option value="completed">Completed</option><option value="pending">Pending</option><option value="failed">Failed</option><option value="interrupted">Connection lost</option></select>
  </div>
</div>
<div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<dialog id="modal" aria-labelledby="modal-title"><div class="dialog-header"><h2 id="modal-title"></h2><button class="close" data-action="close-modal" aria-label="Close dialog">×</button></div><div id="modal-body" class="dialog-body"></div></dialog>
<script>

(() => {
 'use strict';

 // Theme preference stays independent of the sample account state.
 const moonIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.6 8.6 0 0 1 9.8 3.5 8.7 8.7 0 1 0 20.5 14.2Z"/></svg>';
 const sunIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
 function applyTheme(theme) {
   const dark = theme === 'dark';
   document.documentElement.dataset.theme = dark ? 'dark' : 'light';
   const button = document.querySelector('#theme-toggle');
   button.innerHTML = (dark ? sunIcon : moonIcon) + '<span>' + (dark ? 'Light mode' : 'Dark mode') + '</span>';
   button.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
   document.querySelector('meta[name="theme-color"]').content = dark ? '#0b1521' : '#f2f6f8';
 }
 function toggleTheme() {
   const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
   applyTheme(next);
   try { localStorage.setItem('luma-theme', next); } catch {}
   announce(next === 'dark' ? 'Dark mode enabled.' : 'Light mode enabled.');
 }
 const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
 systemTheme.addEventListener('change', event => {
   let saved; try { saved = localStorage.getItem('luma-theme'); } catch {}
   if (!saved) applyTheme(event.matches ? 'dark' : 'light');
 });
 applyTheme(document.documentElement.dataset.theme);
 function accountIcon(account) {
   const path = account === 'chequing'
     ? '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18m-13 5h3"/>'
     : '<path d="M4 19V9m5 10V5m5 14v-7m5 7V3M3 21h18"/>';
   return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + path + '</svg>';
 }

 // Download the original local file or page, including all embedded code.
 document.querySelector('#download-source').href = window.location.href;
 // SAMPLE DATA: fixed dates and balances make peer testing repeatable.
 const TODAY='2026-11-15', DUE='2026-11-20', ORIGINAL=642.18, MINIMUM=25, KEY='luma-banking-demo-v2';
 const $=s=>document.querySelector(s), app=$('#app'), modal=$('#modal');
 const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const money=v=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(Number(v));
 const round=v=>Math.round((Number(v)+Number.EPSILON)*100)/100;
 const dateText=(s,long=false)=>new Intl.DateTimeFormat('en-CA',{weekday:long?'short':undefined,month:'short',day:'numeric',year:long?'numeric':undefined,timeZone:'UTC'}).format(new Date(s+'T12:00:00Z'));
 const names={chequing:'Chequing',savings:'Savings'};
 const suffix={chequing:'1042',savings:'2096'};
 const fresh=()=>({view:'accounts',stage:'idle',balance:{chequing:1950,savings:3200},remaining:ORIGINAL,draft:null,error:'',duplicateAccepted:false,outcome:'completed',current:null,filter:'all',query:'',sequence:1,records:[{id:'DEMO-261113-001',payee:'Visa credit card',last4:'4821',amount:75,from:'chequing',date:'2026-11-13',status:'completed',time:'6:42 p.m.',posted:'Nov 13, 2026 at 6:42 p.m.'}]});
 let state=fresh(), submitTimer=null, toastTimer=null;
 try {const saved=JSON.parse(sessionStorage.getItem(KEY)||'null');if(saved&&Date.now()-saved.savedAt<15*60*1000){state={...fresh(),...saved.state};if(state.stage==='submitting')state.stage='review';}}catch{}
 const persist=()=>{try{sessionStorage.setItem(KEY,JSON.stringify({savedAt:Date.now(),state}));}catch{}};
 function announce(t){$('#announcer').textContent=t;}
 function toast(t){document.querySelector('.toast')?.remove();const div=document.createElement('div');div.className='toast';div.textContent=t;document.body.append(div);clearTimeout(toastTimer);toastTimer=setTimeout(()=>div.remove(),3000);announce(t);}
 function openModal(title,body){$('#modal-title').textContent=title;$('#modal-body').innerHTML=body;if(!modal.open)modal.showModal();}
 function steps(active){return `<div class="steps" aria-label="Payment progress">${['Payment','Review','Status'].map((x,i)=>`<span class="step ${i+1===active?'active':i+1<active?'done':''}" ${i+1===active?'aria-current="step"':''}><span class="step-no">${i+1<active?'✓':i+1}</span><span class="step-name">${x}</span></span>`).join('')}</div>`;}
 function available(){return state.balance[state.draft?.from||'chequing'];}
 function draftAmount(){return round(Number(state.draft?.amount)||0);}
 function statusLabel(status){return ({completed:'Completed',pending:'Pending',failed:'Failed',scheduled:'Scheduled'})[status]||'Checking';}
 function cardHeader(){return `<div class="card-head"><div class="card-title"><span class="card-icon" aria-hidden="true"></span><div><h3>Visa credit card <span class="muted">•••• 4821</span></h3><div class="small">Luma Everyday · Credit card</div></div></div><div class="card-head-right"><span class="visa-word" aria-hidden="true">VISA</span><span class="status-tag">${state.remaining<=0?'Statement paid':`Due ${dateText(DUE)}`}</span></div></div>`;}
 function accountBalances(){return `<div class="balances">${Object.keys(names).map(k=>`<div class="balance account-${k}"><div class="balance-name"><span class="account-icon" aria-hidden="true">${accountIcon(k)}</span><div><div class="balance-label">${names[k]}</div><div class="last4">Account •••• ${suffix[k]}</div></div></div><div class="balance-amount"><strong class="tabular">${money(state.balance[k])}</strong><span>Available balance</span></div></div>`).join('')}</div>`;}
 function context(){return `<aside class="context" aria-label="Credit card payment information"><div class="context-title">Your November statement</div><div class="key-label">Statement balance remaining <button class="help-link" data-action="term" data-term="statement" aria-label="Explain statement balance">ⓘ</button></div><div class="amount-large tabular">${money(state.remaining)}</div><div class="context-row"><span>Minimum payment</span><strong>${money(Math.min(MINIMUM,state.remaining))}</strong></div><div class="context-row"><span>Due date</span><strong>${dateText(DUE,true)}</strong></div><p class="context-note">These details stay here while you pay. You can check the amount without leaving this card.</p></aside>`;}
 function idle(){return `<div class="idle-body"><div class="statement-overview"><div><div class="key-label">Statement balance remaining <button class="help-link" data-action="term" data-term="statement" aria-label="Explain statement balance">ⓘ</button></div><div class="amount-large tabular">${money(state.remaining)}</div></div><div class="overview-middle"><div class="key-label">Minimum payment</div><div class="key-value tabular">${money(Math.min(MINIMUM,state.remaining))}</div></div><div class="overview-middle"><div class="key-label">Payment due</div><div class="key-value">${dateText(DUE,true).replace(', 2026','')}</div></div></div><div class="idle-action"><p>${state.remaining<=0?'Your November statement has been paid. You can view the payment in Activity.':'Pay directly from this card. Keep the amount owed and your available funds in view.'}</p><button class="btn primary" data-action="start">${state.remaining<=0?'Make a payment':'Pay this card'} <span class="arrow" aria-hidden="true">→</span></button></div></div>`;}
 // PAYMENT SCREEN: persistent statement context beside editable fields.
 function editForm(){const d=state.draft,amount=draftAmount();return `<div class="card-stage" id="payment-stage"><div class="stage-top"><h3>Pay your card</h3>${steps(1)}</div><form id="payment-form" novalidate><div class="form-grid">${context()}<div><div class="field"><label for="funding">Pay from</label><select id="funding" name="funding">${Object.keys(names).map(k=>`<option value="${k}" ${d.from===k?'selected':''}>${names[k]} •••• ${suffix[k]}</option>`).join('')}</select><div class="available">Available balance: <strong id="funding-balance" class="tabular">${money(available())}</strong> <button type="button" class="help-link" data-action="term" data-term="available" aria-label="Explain available balance">ⓘ</button></div></div><div class="field"><label for="amount">Payment amount</label><div class="choice-group" role="group" aria-label="Choose a payment amount">${[['statement','Statement balance'],['minimum','Minimum'],['other','Other amount']].map(([v,t])=>`<button type="button" class="choice ${d.choice===v?'selected':''}" data-action="amount-choice" data-choice="${v}" aria-pressed="${d.choice===v}">${t}</button>`).join('')}</div><div class="money-input"><span aria-hidden="true">$</span><input id="amount" name="amount" inputmode="decimal" type="text" value="${esc(d.amount)}" autocomplete="off" aria-describedby="amount-hint amount-error" aria-invalid="${!!state.error}"></div><p id="amount-hint" class="hint">${d.choice==='statement'?'Filled in from your statement. You can change it.':d.choice==='minimum'?'The minimum amount due on this statement.':'Enter the amount you want to pay.'}</p><p id="amount-error" class="error" role="alert">${esc(state.error)}</p></div><div class="field"><label for="when">Payment date</label><select id="when" name="when"><option value="today" ${d.when==='today'?'selected':''}>Today, ${dateText(TODAY)}</option><option value="later" ${d.when==='later'?'selected':''}>Choose another date</option></select>${d.when==='later'?`<label for="payment-date" class="sr-only">Choose payment date</label><input style="margin-top:8px" id="payment-date" name="payment-date" type="date" min="${TODAY}" value="${esc(d.date)}">`:''}</div>${amount>0&&amount<Math.min(MINIMUM,state.remaining)?`<p class="warning">This is less than the minimum payment of ${money(Math.min(MINIMUM,state.remaining))}. The rest of the minimum will still be due by ${dateText(DUE)}.</p>`:''}${d.date>DUE?'<p class="warning">This date is after your payment due date. Check the date before continuing.</p>':''}</div></div><div class="form-footer"><p class="hint">You’ll review everything before sending.</p><div class="buttons"><button type="button" class="btn text" data-action="cancel">Cancel</button><button type="submit" class="btn primary">Review payment <span class="arrow" aria-hidden="true">→</span></button></div></div></form></div>`;}
 // DUPLICATE CHECK: warn about a matching recent payment.
 function matchingDuplicate(){const d=state.draft;return state.records.find(r=>r.amount===draftAmount()&&r.last4==='4821'&&r.status!=='failed'&&Math.abs((new Date(TODAY)-new Date(r.date))/86400000)<=3);}
 function reviewDetails(record=null){const d=record||{amount:draftAmount(),from:state.draft.from,date:state.draft.date};return `<dl class="review-details"><div><dt>Pay to</dt><dd>Visa credit card<small>•••• 4821</small></dd></div><div><dt>Pay from</dt><dd>${names[d.from]}<small>•••• ${suffix[d.from]}</small></dd></div><div><dt>Payment date</dt><dd>${dateText(d.date,true)}</dd></div><div class="payment-total"><dt>Amount</dt><dd class="tabular">${money(d.amount)}</dd></div></dl>`;}
 // REVIEW SCREEN: confirm card, funding account, amount and date.
 function review(){const a=draftAmount(),dup=matchingDuplicate(),blocked=dup&&!state.duplicateAccepted;return `<div class="card-stage" id="payment-stage"><div class="stage-top"><h3>Review your payment</h3>${steps(2)}</div><div class="review-grid"><div class="review-note"><h4>Does everything look right?</h4><p>Check the amount, card and funding account. You can still change the details.</p><div class="review-pair"><div class="compare-box"><span>Statement remaining</span><strong class="tabular">${money(state.remaining)}</strong></div><span class="compare-equals" aria-hidden="true">${a===state.remaining?'=':'→'}</span><div class="compare-box"><span>You’re paying</span><strong class="tabular">${money(a)}</strong></div></div><div class="available" style="margin-top:12px">Available in ${names[state.draft.from]}: <strong>${money(available())}</strong></div>${a>state.remaining?`<p class="warning">This payment is ${money(a-state.remaining)} more than the remaining statement balance. Check that this is intentional.</p>`:''}${a<Math.min(MINIMUM,state.remaining)?`<p class="warning">This is less than the ${money(Math.min(MINIMUM,state.remaining))} minimum. The rest of the minimum is still due by ${dateText(DUE)}.</p>`:''}${state.draft.date>DUE?'<p class="warning">Your selected date is after the due date.</p>':''}</div>${reviewDetails()}</div>${blocked?`<div class="duplicate" role="alert"><h4>Could this be a duplicate payment?</h4><p>A ${money(dup.amount)} payment to Visa •••• 4821 is already in your activity from ${dateText(dup.date)} (${statusLabel(dup.status).toLowerCase()}). Check it before sending another.</p><div class="duplicate-actions"><button class="btn" data-action="record" data-id="${dup.id}">View that payment</button><button class="btn text" data-action="allow-duplicate">Continue anyway</button></div></div>`:state.duplicateAccepted?'<p class="hint" style="margin-top:15px">You chose to continue with another payment after the duplicate warning.</p>':''}<div class="form-footer"><p class="hint">${state.draft.date>TODAY?'Your payment will be scheduled for the selected date.':'Your payment is sent only after you confirm.'}</p><div class="buttons"><button class="btn text" data-action="edit">Edit details</button>${blocked?'':`<button class="btn primary" data-action="submit">${state.draft.date>TODAY?'Schedule':'Pay'} ${money(a)} <span class="arrow" aria-hidden="true">→</span></button>`}</div></div></div>`;}
 function loading(){return `<div class="card-stage" id="payment-stage"><div class="stage-top"><h3>Sending your payment</h3>${steps(3)}</div><div class="loading" role="status"><span class="spinner" aria-hidden="true"></span><h3>Submitting ${money(draftAmount())}…</h3><p>We’re checking the payment. Please wait before trying again.</p></div></div>`;}
 function result(){const r=state.current;if(!r)return idle();const unknown=state.stage==='uncertain';let title,subtitle,symbol;if(unknown){title='Let’s check what happened';subtitle='The connection was lost before confirmation appeared. The payment may have gone through. Check its status before paying again.';symbol='?';}else if(r.status==='completed'){title='Payment completed';subtitle=`${money(r.amount)} was paid to Visa •••• 4821. Your balances below have been updated.`;symbol='✓';}else if(r.status==='pending'){title='Payment received. Still processing.';subtitle='Your payment was accepted, but it has not finished processing. You do not need to send it again.';symbol='◷';}else if(r.status==='scheduled'){title='Your payment is scheduled';subtitle=`We’ll send ${money(r.amount)} on ${dateText(r.date,true)}. No money has moved yet.`;symbol='▦';}else{title='Payment wasn’t sent';subtitle='The payment service could not complete this request. Your balances have not changed.';symbol='!';}
 return `<div class="card-stage" id="payment-stage"><div class="stage-top"><span class="small muted">${unknown?'Check payment status':'Payment summary'}</span>${steps(3)}</div><div class="result" data-status="${unknown?'uncertain':r.status}"><div class="result-heading"><span class="result-symbol" aria-hidden="true">${symbol}</span><div><h3>${title}</h3><p>${subtitle}</p></div></div><div class="result-grid"><div>${reviewDetails(r)}<p class="hint" style="margin-top:9px">Reference: ${esc(r.id)}${unknown?'':` · ${r.time}`}</p></div><div class="balance-result"><div class="key-label">${unknown?'Amount to check':'Statement balance remaining'}</div><div class="amount-large tabular">${money(unknown?r.amount:state.remaining)}</div><p>${unknown?'Match this amount, card and reference to the payment record.':r.status==='completed'?(state.remaining===0?'Your November statement is paid. No further payment is needed for this statement.':`You can check the remaining amount here before the ${dateText(DUE)} due date.`):r.status==='pending'?'This balance will update once the payment completes. Pending does not mean paid.':r.status==='scheduled'?'The statement balance will update after the scheduled payment completes.':'No payment was applied to this statement.'}</p>${r.status==='pending'&&!unknown?'<div class="warning"><strong>What happens next?</strong>Expected by Nov 17 in this demo. Check Activity for updates. Contact support if it is still pending after that date.</div>':''}${r.status==='failed'&&!unknown?'<div class="warning"><strong>What to do next</strong>Review your details and try again. If it fails again, contact support with the reference above.</div>':''}</div></div><div class="result-actions">${unknown?'<button class="btn primary" data-action="check-status">Check this payment’s status <span class="arrow" aria-hidden="true">→</span></button>':r.status==='failed'?'<button class="btn primary" data-action="edit">Review details and try again</button>':'<button class="btn primary" data-action="done">Done</button>'}<button class="btn ${unknown?'text':''}" data-action="activity">View activity</button>${r.status==='failed'||r.status==='pending'?'<button class="btn text" data-action="help">Get help</button>':''}</div></div></div>`;}
 function renderAccounts(){const body=state.stage==='idle'?idle():state.stage==='editing'?editForm():state.stage==='review'?review():state.stage==='submitting'?loading():result();app.innerHTML=`<div class="heading-row"><div><div class="eyebrow">YOUR ACCOUNTS</div><h2>Good evening, Maya.</h2><p>A clearer view of your everyday money.</p></div><div class="asof">Sunday, Nov 15, 2026<br><span class="currency">All amounts in CAD</span></div></div>${accountBalances()}<section class="card" aria-label="Visa credit card">${cardHeader()}${body}</section><div class="bottom-note"><span>Check your card details and make a payment in one place.</span><button class="help-link" data-action="help">Need help?</button></div>`;}
 function recordRow(r){return `<button class="transaction" data-action="record" data-id="${r.id}"><span class="tx-icon" aria-hidden="true">↗</span><span class="tx-name"><strong>Visa credit card •••• 4821</strong><small>${dateText(r.date,true)} · From ${names[r.from]} •••• ${suffix[r.from]}</small></span><span class="tx-amount"><strong class="tabular">${money(r.amount)}</strong><span class="status-tag ${r.status}">${statusLabel(r.status)}</span></span><span class="muted" aria-hidden="true">›</span></button>`;}
 function filteredRecords(){const q=state.query.toLowerCase();return state.records.filter(r=>(state.filter==='all'||r.status===state.filter)&&(!q||`${r.payee} ${r.last4} ${r.amount.toFixed(2)} ${r.date} ${dateText(r.date,true)} ${r.id} ${names[r.from]}`.toLowerCase().includes(q)));}
 function updateActivityList(){const rows=filteredRecords();$('#activity-list').innerHTML=rows.length?rows.map(recordRow).join(''):'<div class="empty">No payments match. Try another amount, card name or date.</div>';}
 // ACTIVITY: searchable payment records and status filtering.
 function renderActivity(){app.innerHTML=`<div class="heading-row"><div><h2>Your activity</h2><p>Check a payment before making another one.</p></div><button class="btn text" data-action="accounts">Back to accounts</button></div>${state.draft&&['editing','review'].includes(state.stage)?'<div class="resume"><span>Your payment details are saved for this session.</span><button class="btn" data-action="accounts">Resume payment</button></div>':''}<div class="activity-controls"><label for="activity-search" class="sr-only">Search payments by card, amount, date or reference</label><input id="activity-search" type="search" placeholder="Search card, amount, date or reference" value="${esc(state.query)}"><label for="activity-filter" class="sr-only">Filter payment status</label><select id="activity-filter">${['all','completed','pending','failed','scheduled'].map(v=>`<option value="${v}" ${state.filter===v?'selected':''}>${v==='all'?'All statuses':statusLabel(v)}</option>`).join('')}</select></div><div class="activity-list" id="activity-list"></div><div class="bottom-note"><span>Every record includes its status and payment reference.</span><button class="help-link" data-action="help">Need help?</button></div>`;updateActivityList();}
 function render(){document.querySelectorAll('.nav-btn').forEach(b=>{const active=b.dataset.action===state.view;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});$('#outcome').value=state.outcome;if(state.view==='activity')renderActivity();else renderAccounts();persist();}
 function focusStage(){requestAnimationFrame(()=>{const target=$('#payment-stage');if(target&&window.innerWidth<761)target.scrollIntoView({behavior:'auto',block:'start'});});}
 function start(){state.draft={from:'chequing',amount:state.remaining>0?state.remaining.toFixed(2):'',choice:state.remaining>0?'statement':'other',when:'today',date:TODAY};state.stage='editing';state.error='';state.duplicateAccepted=false;state.current=null;render();focusStage();announce('Payment opened. Statement balance and available funds are visible.');}
 // VALIDATION: amount precision, positive amount, funds and date.
 function validate(){const d=state.draft;const raw=d.amount.trim();if(!/^\d+(\.\d{1,2})?$/.test(raw)||Number(raw)<=0)return 'Enter an amount greater than $0.00, using up to two decimal places.';if(draftAmount()>available())return `You have ${money(available())} available in ${names[d.from]}. Choose another account or enter a smaller amount.`;if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date)||Number.isNaN(Date.parse(d.date))||d.date<TODAY)return 'Choose today or a later payment date.';return '';}
 function reviewPayment(){state.error=validate();if(state.error){render();$('#amount')?.focus();announce(state.error);return;}state.draft.amount=draftAmount().toFixed(2);state.stage='review';state.duplicateAccepted=false;render();focusStage();announce('Review the payee, account, date and amount before submitting.');}
 function completeSubmit(outcome){const d=state.draft;const dateSuffix=TODAY.replaceAll('-','').slice(2);const id=`DEMO-${dateSuffix}-${String(state.sequence++).padStart(3,'0')}`;const status=d.date>TODAY?'scheduled':outcome==='interrupted'?'completed':outcome;const r={id,payee:'Visa credit card',last4:'4821',amount:draftAmount(),from:d.from,date:d.date,requestedDate:TODAY,status,time:'7:15 p.m.',posted:status==='completed'?`${dateText(TODAY,true)} at 7:15 p.m.`:null};state.records.unshift(r);if(status==='completed'){state.balance[d.from]=round(state.balance[d.from]-r.amount);state.remaining=round(Math.max(0,state.remaining-r.amount));}state.current=r;state.stage=outcome==='interrupted'&&status==='completed'?'uncertain':'result';state.view='accounts';render();focusStage();announce(state.stage==='uncertain'?'Connection lost. Check the payment status before trying again.':`Payment ${statusLabel(status).toLowerCase()}.`);}
 function submit(){if(state.stage!=='review')return;const err=validate();if(err){state.error=err;state.stage='editing';render();return;}if(matchingDuplicate()&&!state.duplicateAccepted)return;const outcome=state.outcome;state.stage='submitting';render();focusStage();submitTimer=setTimeout(()=>completeSubmit(outcome),1050);}
 function showRecord(id){const r=state.records.find(x=>x.id===id);if(!r)return;const next=r.status==='completed'?'This payment is complete. You do not need to repeat it.':r.status==='pending'?'This payment is still processing. Expected by Nov 17 in this demo. Do not send it again while it is pending.':r.status==='scheduled'?`This payment is set for ${dateText(r.date,true)}. It has not been sent yet.`:'This payment was not sent. You can review your details and try again.';openModal('Payment details',`<p><span class="status-tag ${r.status}">${statusLabel(r.status)}</span></p><div style="margin-top:16px">${reviewDetails(r)}</div><p style="margin-top:15px;font-size:12px"><strong>Reference:</strong> ${esc(r.id)}<br><strong>Requested:</strong> ${dateText(r.requestedDate||r.date,true)}, ${r.time}${r.posted?`<br><strong>Completed:</strong> ${esc(r.posted)}`:''}</p><div class="warning">${next}</div><div class="dialog-actions"><button class="btn primary" data-action="close-modal">Back</button>${state.current?.id===id&&state.stage==='uncertain'?'<button class="btn" data-action="record-confirmed">Return to payment summary</button>':''}</div>`);}
 const terms={statement:['Statement balance','The amount from your last monthly credit card statement that still needs to be paid. It may differ from your current card balance if you made purchases after that statement. The November statement balance shown here is $642.18.'],available:['Available balance','The money currently available to spend from this account. Check that it covers your payment before confirming. Available balances are shown alongside your payment details.'],pending:['Pending payment','The payment request has been accepted but has not finished processing. It is not the same as completed. Check the expected processing time and avoid making the same payment again while its outcome is unresolved.']};
 function help(){openModal('Help with your card payment',`<p>Keep your card, amount and funding account together while you pay.</p><details open><summary>What is my statement balance?</summary><p>${terms.statement[1]}</p></details><details><summary>What does available balance mean?</summary><p>${terms.available[1]}</p></details><details><summary>My payment is pending. Should I pay again?</summary><p>${terms.pending[1]}</p></details><details><summary>I lost the connection after submitting.</summary><p>Open Activity and match the card, amount, date and payment reference. Check the status before trying again.</p></details><details><summary>How can I correct the payment?</summary><p>Choose Edit details on the review screen before submitting. Change the amount, funding account or date, then review the updated details.</p></details><h3>Still need help?</h3><p>Keep your payment reference handy when contacting support. This interactive demo uses sample accounts and does not connect to a bank.</p>`);}
 document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;if(b.closest('form')&&!b.hasAttribute('type'))e.preventDefault();if(state.stage==='submitting'&&!['toggle-theme','help','term','close-modal','test-controls','reset'].includes(action)){toast('Please wait for the payment result.');return;}switch(action){case 'toggle-theme':toggleTheme();break;case 'start':start();break;case 'accounts':state.view='accounts';render();break;case 'activity':state.view='activity';state.query='';state.filter='all';render();break;case 'help':help();break;case 'term':{const t=terms[b.dataset.term];openModal(t[0],`<p>${t[1]}</p>`);break;}case 'close-modal':modal.close();break;case 'test-controls':{const open=$('#test-controls').classList.toggle('open');b.setAttribute('aria-expanded',String(open));break;}case 'reset':clearTimeout(submitTimer);state=fresh();render();modal.close();toast('Demo reset. Original balances restored.');break;case 'cancel':state.stage='idle';state.draft=null;state.error='';render();announce('Payment cancelled. No money was sent.');break;case 'amount-choice':{const choice=b.dataset.choice;state.draft.choice=choice;state.draft.amount=choice==='statement'?state.remaining.toFixed(2):choice==='minimum'?Math.min(MINIMUM,state.remaining).toFixed(2):'';state.error='';state.duplicateAccepted=false;render();if(choice==='other')$('#amount')?.focus();break;}case 'edit':state.stage='editing';state.error='';state.duplicateAccepted=false;render();focusStage();break;case 'allow-duplicate':state.duplicateAccepted=true;render();announce('You chose to continue. Review before submitting another payment.');break;case 'submit':submit();break;case 'done':state.stage='idle';state.draft=null;state.current=null;render();announce('Returned to your card.');break;case 'record':showRecord(b.dataset.id);break;case 'check-status':state.stage='result';render();announce('The matching payment completed. Do not repeat it.');break;case 'record-confirmed':modal.close();state.view='accounts';state.stage='result';render();break;}});
 document.addEventListener('submit',e=>{if(e.target.id==='payment-form'){e.preventDefault();reviewPayment();}});
 document.addEventListener('input',e=>{if(e.target.id==='amount'){state.draft.amount=e.target.value;state.draft.choice='other';state.error='';state.duplicateAccepted=false;$('#amount-error').textContent='';e.target.setAttribute('aria-invalid','false');document.querySelectorAll('.choice').forEach(b=>{const selected=b.dataset.choice==='other';b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected));});$('#amount-hint').textContent='Enter the amount you want to pay.';persist();}else if(e.target.id==='activity-search'){state.query=e.target.value;updateActivityList();persist();}});
 document.addEventListener('change',e=>{const id=e.target.id;if(id==='outcome'){state.outcome=e.target.value;persist();}else if(id==='funding'){state.draft.from=e.target.value;state.error='';state.duplicateAccepted=false;render();$('#funding')?.focus();}else if(id==='when'){state.draft.when=e.target.value;state.draft.date=TODAY;render();if(state.draft.when==='later')$('#payment-date')?.focus();}else if(id==='payment-date'){state.draft.date=e.target.value;state.error='';render();$('#payment-date')?.focus();}else if(id==='activity-filter'){state.filter=e.target.value;updateActivityList();persist();}});
 modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close();}});
 render();
})();

</script>
